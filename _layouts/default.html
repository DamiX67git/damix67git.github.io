<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description"
        content="{{ page.description | default: site.description | escape }}">

  <meta name="theme-color" content="#101116">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body class="{{ page.body_class | default: 'site-page' }}">
  {% include navigation.html %}

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>Built with curiosity. Powered by creativity.</p>
    <p>© {{ site.time | date: "%Y" }} {{ site.title }}</p>
  </footer>
</body>
</html>
